name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run ruff check .
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85 -x --tb=short 2>&1 | tee pytest.log
      - name: 失败诊断（写入 job summary）
        if: failure()
        run: |
          {
            echo '## pytest 失败详情'
            echo '```'
            tail -n 120 pytest.log
            echo '```'
            echo '## 环境信息'
            echo '```'
            uv --version
            python --version
            uname -a
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
