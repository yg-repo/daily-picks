name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run ruff check .
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85 -q --tb=short 2>&1 | tee pytest.log
      - name: 失败诊断（输出为 annotation，API 可读）
        if: failure()
        run: |
          echo "::error title=FAILED_CASES::$(grep -E '^(FAILED|ERROR)' pytest.log | head -5 | tr '\n' '|')"
          echo "::error title=PYTEST_TAIL::$(tail -c 1200 pytest.log | tr '\n' '~')"
          echo "::notice title=ENV::$(uv --version) $(python --version 2>&1) $(uname -sr)"
